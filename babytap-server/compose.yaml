services:
  babytap-server:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: babybuddy.settings.base
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
    ports:
      - "${BABYTAP_SERVER_PORT:-8000}:8000"
    volumes:
      - babytap-data:/app/data
      - babytap-media:/app/media
    restart: unless-stopped

volumes:
  babytap-data:
  babytap-media:
