[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babytap"
version = "0.1.0"
description = "EasyInput companion app for Baby Buddy"
requires-python = ">=3.9"
dependencies = [
  "bleak>=0.22,<1",
  "fastapi>=0.115,<1",
  "hidapi>=0.14,<1",
  "httpx>=0.27,<1",
  "pyserial>=3.5,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
